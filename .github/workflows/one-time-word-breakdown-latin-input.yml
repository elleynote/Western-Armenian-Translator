name: One-time Word Breakdown Latin input patch

on:
  push:
    branches:
      - feature/word-breakdown-latin-input
    paths:
      - .github/workflows/one-time-word-breakdown-latin-input.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/word-breakdown-latin-input
          fetch-depth: 0

      - name: Apply bounded Latin input patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f"{label}: expected 1 match, found {count}"
              return text.replace(old, new, 1)

          edge_path = Path("supabase/functions/word-breakdown/index.ts")
          edge = edge_path.read_text()

          edge = replace_once(
              edge,
              '''type WordBreakdownLanguage =\n  | "hyw"\n  | "hye";\n''',
              '''type WordBreakdownLanguage =\n  | "hyw"\n  | "hye";\n\nconst ARMENIAN_SCRIPT_PATTERN =\n  /[\\u0531-\\u058F]/u;\n''',
              "add Armenian script detector",
          )

          edge = replace_once(
              edge,
              '''function openAiError(\n  error: unknown,\n): {''',
              '''async function normalizeLatinTransliteration(\n  client: OpenAI,\n  model: string,\n  reasoning:\n    | {\n        effort: "none" | "minimal";\n      }\n    | undefined,\n  text: string,\n  language: WordBreakdownLanguage,\n): Promise<string> {\n  const languageName =\n    language === "hye"\n      ? "Eastern Armenian"\n      : "Western Armenian";\n\n  const orthographyRule =\n    language === "hye"\n      ? "Use standard Eastern Armenian spelling."\n      : "Use traditional Western Armenian orthography.";\n\n  const response =\n    await client.responses.create({\n      model,\n\n      instructions:\n        `Convert the supplied Latin-script Armenian transliteration into ${languageName} Armenian script. ${orthographyRule} Treat the input as phonetic Armenian transliteration, not as English to translate. Preserve the intended Armenian words, punctuation, and sentence meaning. Output only the Armenian-script text with no explanation, labels, markdown, or Latin text.`,\n\n      input: text,\n\n      max_output_tokens: 700,\n\n      ...(reasoning\n        ? {\n            reasoning,\n          }\n        : {}),\n\n      store: false,\n    });\n\n  const normalized =\n    Array.from(\n      response.output_text\n        ?.trim() ??\n      "",\n    )\n      .slice(0, 500)\n      .join("")\n      .trim();\n\n  if (\n    !normalized ||\n    !ARMENIAN_SCRIPT_PATTERN.test(\n      normalized,\n    )\n  ) {\n    throw new Error(\n      "INVALID_ARMENIAN_TRANSLITERATION",\n    );\n  }\n\n  return normalized;\n}\n\nfunction openAiError(\n  error: unknown,\n): {''',
              "add Latin normalization function",
          )

          edge = replace_once(
              edge,
              '''    const knowledge =\n      await findRelevantContext(\n        admin,\n        text,\n        language,\n        "en",\n      );\n''',
              '''    const model =\n      config.openAiModel;\n\n    const reasoning =\n      reasoningForModel(\n        model,\n      );\n\n    const client =\n      new OpenAI({\n        apiKey:\n          config.openAiApiKey,\n\n        maxRetries:\n          0,\n\n        timeout:\n          config.openAiTimeoutMs,\n      });\n\n    const hasArmenianScript =\n      ARMENIAN_SCRIPT_PATTERN.test(\n        text,\n      );\n\n    let analysisText =\n      text;\n\n    let interpretedInput =\n      "";\n\n    if (!hasArmenianScript) {\n      try {\n        analysisText =\n          await normalizeLatinTransliteration(\n            client,\n            model,\n            reasoning,\n            text,\n            language,\n          );\n\n        interpretedInput =\n          analysisText;\n      } catch (error) {\n        const friendly =\n          openAiError(\n            error,\n          );\n\n        return json(\n          {\n            success: false,\n            error:\n              friendly.message,\n            code:\n              friendly.code,\n          },\n          friendly.status,\n          cors,\n        );\n      }\n    }\n\n    const knowledge =\n      await findRelevantContext(\n        admin,\n        analysisText,\n        language,\n        "en",\n      );\n''',
              "normalize before knowledge lookup",
          )

          edge = replace_once(
              edge,
              '''    const model =\n      config.openAiModel;\n\n    const reasoning =\n      reasoningForModel(\n        model,\n      );\n\n    try {\n      const client =\n        new OpenAI({\n          apiKey:\n            config.openAiApiKey,\n\n          maxRetries:\n            0,\n\n          timeout:\n            config.openAiTimeoutMs,\n        });\n\n      const response =''',
              '''    try {\n      const response =''',
              "reuse OpenAI client",
          )

          edge = replace_once(
              edge,
              '''                      armenian:\n                        text,\n''',
              '''                      armenian:\n                        analysisText,\n''',
              "analyse normalized Armenian",
          )

          edge = replace_once(
              edge,
              '''          input:\n            text,\n\n          naturalMeaning:''',
              '''          input:\n            analysisText,\n\n          interpretedInput,\n\n          naturalMeaning:''',
              "return interpreted Armenian",
          )

          edge_path.write_text(edge)

          api_path = Path("src/lib/word-breakdown-api.ts")
          api = api_path.read_text()

          api = replace_once(
              api,
              '''export interface WordBreakdownResult {\n  input: string;\n  naturalMeaning: string;''',
              '''export interface WordBreakdownResult {\n  input: string;\n  interpretedInput: string;\n  naturalMeaning: string;''',
              "type interpreted input",
          )

          api = replace_once(
              api,
              '''    input:\n      data.input,\n\n    naturalMeaning:''',
              '''    input:\n      data.input,\n\n    interpretedInput:\n      data.interpretedInput,\n\n    naturalMeaning:''',
              "return interpreted input",
          )

          api_path.write_text(api)

          page_path = Path("src/app/word-breakdown/page.tsx")
          page = page_path.read_text()

          page = replace_once(
              page,
              '''                    placeholder={`Enter or paste a ${languageName} word, phrase or short sentence`}''',
              '''                    placeholder={`Enter Armenian script or Latin transliteration for ${languageName}`}''',
              "update input placeholder",
          )

          page = replace_once(
              page,
              '''                      {language === "hyw"\n                        ? "Tip: open Word Breakdown directly from a Western Armenian translation."\n                        : "Tip: choose Eastern Armenian when the text uses Eastern Armenian spelling and grammar."}''',
              '''                      {language === "hyw"\n                        ? "Enter Western Armenian script or Latin transliteration, for example parev tsez."\n                        : "Enter Eastern Armenian script or Latin transliteration; the selected variety controls interpretation."}''',
              "update input helper",
          )

          page = replace_once(
              page,
              '''              {result ? (\n                <section className="word-breakdown-results">\n                  <div className="word-breakdown-query-summary">''',
              '''              {result ? (\n                <section className="word-breakdown-results">\n                  {result.interpretedInput ? (\n                    <div className="word-breakdown-query-summary">\n                      <span className="word-breakdown-query-label">\n                        Interpreted as\n                      </span>\n\n                      <ArmenianText\n                        text={result.interpretedInput}\n                        language={resultLanguage}\n                        className="word-breakdown-query-text"\n                      />\n                    </div>\n                  ) : null}\n\n                  <div className="word-breakdown-query-summary">''',
              "show interpreted Armenian",
          )

          page_path.write_text(page)
          PY

      - name: Verify bounded diff syntax
        run: |
          git diff --check
          node scripts/test-word-breakdown-latin-input.mjs

      - name: Commit implementation and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-word-breakdown-latin-input.yml
          git add src/app/word-breakdown/page.tsx src/lib/word-breakdown-api.ts supabase/functions/word-breakdown/index.ts
          git diff --cached --check
          git commit -m "feat: support Latin input in word breakdown"
          git push origin HEAD:feature/word-breakdown-latin-input
