name: One-time Role-Play language patch

on:
  push:
    branches:
      - feature/role-play-word-breakdown-language-toggles
    paths:
      - scripts/apply-role-play-language-patch.mjs
      - .github/workflows/one-time-role-play-language-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/role-play-word-breakdown-language-toggles
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair patch script parser escape
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-role-play-language-patch.mjs")
          text = path.read_text()
          old = r"\n}\n\n\nfunction nextInteractionMode"
          new = r"\n\}\n\n\nfunction nextInteractionMode"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          node --check scripts/apply-role-play-language-patch.mjs

      - name: Apply asserted source patch
        run: node scripts/apply-role-play-language-patch.mjs

      - name: Commit patched Edge Function
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: support Armenian varieties in role-play backend"
          git push origin HEAD:feature/role-play-word-breakdown-language-toggles
