name: One-time Role-Play language patch

on:
  push:
    branches:
      - feature/role-play-word-breakdown-language-toggles
    paths:
      - scripts/apply-role-play-language-patch.mjs
      - .github/workflows/one-time-role-play-language-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/role-play-word-breakdown-language-toggles
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair patch script assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply-role-play-language-patch.mjs")
          text = path.read_text()

          parser_old = r"\n}\n\n\nfunction nextInteractionMode"
          parser_new = r"\n\}\n\n\nfunction nextInteractionMode"
          assert text.count(parser_old) == 1
          text = text.replace(parser_old, parser_new)

          scope_old = r'''    const openingOccurrences =
                next.match(
                  /scenario\s*\.opening_message/gu,
                ) ?? [];

              assert.equal(
                openingOccurrences.length,
                2,
                `start opening message replacements: expected 2, found ${openingOccurrences.length}`,
              );

              next = next.replace(
                /scenario\s*\.opening_message/gu,
                "openingMessage",
              );'''

          scope_new = r'''    const sessionWriteIndex =
                next.indexOf(
                  "      const sessionResult =",
                );

              assert.notEqual(
                sessionWriteIndex,
                -1,
                "start opening message replacements: session write marker missing",
              );

              const beforeSessionWrite =
                next.slice(
                  0,
                  sessionWriteIndex,
                );

              let sessionWrite =
                next.slice(
                  sessionWriteIndex,
                );

              const openingOccurrences =
                sessionWrite.match(
                  /scenario\s*\.opening_message/gu,
                ) ?? [];

              assert.equal(
                openingOccurrences.length,
                2,
                `start opening message replacements: expected 2 session-write references, found ${openingOccurrences.length}`,
              );

              sessionWrite =
                sessionWrite.replace(
                  /scenario\s*\.opening_message/gu,
                  "openingMessage",
                );

              next =
                beforeSessionWrite +
                sessionWrite;'''

          assert text.count(scope_old) == 1
          text = text.replace(scope_old, scope_new)
          path.write_text(text)
          PY
          node --check scripts/apply-role-play-language-patch.mjs

      - name: Apply asserted source patch
        run: node scripts/apply-role-play-language-patch.mjs

      - name: Commit patched Edge Function
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: support Armenian varieties in role-play backend"
          git push origin HEAD:feature/role-play-word-breakdown-language-toggles
