name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_BILLING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Lint Tun SSO WordPress PHP
        run: |
          php -l wordpress/tun-saas-subscription-bridge/tun-saas-subscription-bridge.php
          php -l wordpress/tun-saas-subscription-bridge/includes/class-tun-sso-settings.php
          php -l wordpress/tun-saas-subscription-bridge/includes/class-tun-sso-provider.php
          php -l wordpress/tun-translator-sso-safe/tun-translator-sso-safe.php
      - run: npm run lint
      - run: npm run test
      - run: npm run verify
      - run: npm run build
